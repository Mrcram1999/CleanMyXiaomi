name: Bug report / Error
description: Report a reproducible problem using redacted or synthetic data.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Do not upload serials, raw inventories, journals or credentials. For safety bypasses, see SECURITY.md.'
  - type: input
    id: version
    attributes:
      label: Project version and host OS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Use synthetic or redacted examples. State whether any operation was applied.
    validations:
      required: true
